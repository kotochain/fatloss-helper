# 把应用发布成「真正的网址」——用户手机上打开网址、加到主屏幕，就是 App。
# 需要你在仓库 Settings → Pages → Source 选 "GitHub Actions"（只需设置一次）。
name: 发布到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 打包要发布的内容（只发应用本体，不发测试和工具）
        run: |
          mkdir -p _site
          cp -r index.html sw.js manifest.webmanifest css js icons _site/
      # enablement: true —— 即使仓库还没手工开通 Pages，也让它自动开通。
      # （第一次发布就是因为没开通而失败的）
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
