name: 报告一个问题
description: 哪里不对、算错了、点不动、显示不对
title: "[问题] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        谢谢反馈。填得越具体，修得越快。不确定的可以留空。
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 你在哪一页、做了什么、结果怎样
      placeholder: 例：在「今天」页写「晚上吃了碗面」，解析出来是 1200 克，明显不对
    validations:
      required: true
  - type: textarea
    id: expect
    attributes:
      label: 你期望是什么
      placeholder: 例：一碗面应该在 400~600 克
  - type: dropdown
    id: area
    attributes:
      label: 大概是哪一块
      options:
        - 算出来的热量/营养不对
        - 一句话记录（解析）不对
        - 食物数据不对（某个食物的热量）
        - 有氧推荐 / 换器械
        - 界面显示 / 点不动
        - AI 设置连不上
        - 其他
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 手机和浏览器
      placeholder: 例：小米 14，Chrome；或者 iPhone Safari
  - type: textarea
    id: extra
    attributes:
      label: 补充（截图最好）
      description: 有截图直接拖进来
