<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 状态栏/浏览器工具栏用界面的奶油底色，跟顶部栏无缝衔接。
     这里以前是绿色 #16a34a（第一版配色），界面换成温暖米粉后忘了改，
     手机上就是「绿色状态栏 + 粉色界面」，很割裂。 -->
<meta name="theme-color" content="#FFF9F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>减脂小助手</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!--
  ┌─ 版本自查（v45）──────────────────────────────────────────────────┐
  │ 为什么必须是内联脚本、不能放在 app.js 里：                          │
  │  1) Service Worker 的策略是「先用缓存、后台更新」，所以打开时页面     │
  │     **本来就是旧版** —— 这是 PWA 的常态，不是 bug；                │
  │  2) 线上 sw.js 带 cache-control: max-age=600，CDN 还会缓存。        │
  │     app.js 里的 cache:'no-store' 只绕浏览器缓存、**绕不过 CDN**，    │
  │     读到的还是旧版本号 → 判定「已是最新」→ 一条提示都没有。          │
  │     用户真撞上：新开网页是旧版、没有任何提示、手动刷新一下才好。      │
  │  3) 这段不依赖 app.js：万一旧版 app.js 本身有问题，提示也不能没有。  │
  │                                                                   │
  │ 下面的 HERE 必须等于 js/version.js 的 APP_VERSION，                │
  │ 由 tests/version.test.mjs 守着（改版本号漏改这里就红）。            │
  └───────────────────────────────────────────────────────────────────┘
-->
<div id="verBar" style="display:none;position:fixed;top:0;left:0;right:0;z-index:2147483647;background:#E86A82;color:#fff;font:14px/1.5 -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;padding:10px 14px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.18);cursor:pointer;-webkit-tap-highlight-color:transparent">
  <span id="verBarText"></span>
</div>
<script>
(function () {
  var HERE = 'v45';
  var bar = document.getElementById('verBar');
  var txt = document.getElementById('verBarText');
  if (!bar || !txt) return;

  function goFresh() {
    var jobs = [];
    try {
      if ('serviceWorker' in navigator) {
        jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
          return Promise.all(rs.map(function (r) { return r.unregister(); }));
        }));
      }
    } catch (e) { /* 不支持就算了，下面照样重载 */ }
    try {
      if (window.caches) {
        jobs.push(caches.keys().then(function (ks) {
          return Promise.all(ks.map(function (k) { return caches.delete(k); }));
        }));
      }
    } catch (e) { /* 同上 */ }
    // 只清「代码缓存」，**不碰 localStorage** —— 记录、资料、AI 密钥都留着
    Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
  }
  bar.addEventListener('click', goFresh);

  /*
   * ?ts= 让每次请求都回源：sw.js 在 GitHub Pages 上是 max-age=600，
   * 不带时间戳的话 CDN 会把旧的 sw.js 直接还给你，版本号永远读不到新的。
   */
  fetch('sw.js?ts=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.text() : ''; })
    .then(function (t) {
      var m = t.match(/APP_VERSION = '([^']+)'/);
      if (!m || !m[1] || m[1] === HERE) return;
      txt.textContent = '有新版本 ' + m[1] + '，点这里更新（记录不会丢）';
      bar.style.display = 'block';
      // 顺手催浏览器去装新版 Service Worker（装好再刷新就是新代码）
      try {
        navigator.serviceWorker.getRegistration().then(function (reg) {
          if (reg && reg.update) reg.update();
        });
      } catch (e) { /* 忽略 */ }
    })
    .catch(function () { /* 离线或网络抖动：安静，app.js 启动后还会再试一次 */ });
})();
</script>
<!--
  最外层兜底：如果 js/app.js 根本没跑起来（语法/加载/早期异常），页面上要有人话，
  而不是一片空白。用户只会说「卡死了、点不动」—— 这正是这个应用最该避免的体验。
  这段必须内联、不依赖任何模块，因为它要处理的正是「模块没起来」。
-->
<script>
  window.__appReady = false;
  /*
   * 用捕获阶段监听：模块加载失败（404/被拦截/网络断）只会在 <script> 上触发 error，
   * 而且**不冒泡** —— 以前没有 capture，所以模块根本没加载时它抓不到，只能等超时。
   * 只认「脚本加载失败」和真正的 JS 异常，不因为图标/图片失败就误报。
   */
  window.addEventListener('error', function (e) {
    if (window.__appReady) return;            // 已经正常启动，交给应用自己处理
    var target = e && e.target;
    var scriptFailed = target && target.tagName === 'SCRIPT';
    var runtimeError = e && (e.message || e.error);
    if (!scriptFailed && !runtimeError) return;
    var loading = document.getElementById('bootLoading');
    if (loading) loading.hidden = true;
    var box = document.getElementById('bootFail');
    if (!box) return;
    box.hidden = false;
    var detail = document.getElementById('bootFailDetail');
    if (detail) detail.textContent = String((e && (e.message || e.error)) || '页面脚本没能加载');
  }, true);
  /*
   * 8~20 秒都没跑起来才提示「没能打开」。
   * 以前是 4 秒 —— 手机第一次打开、或者在慢网/代理下要按顺序下 30 多个模块，
   * 实测冷启动 14 秒，于是用户会先看到一张「没能打开」的错误卡，过几秒又自己好了。
   * 正常加载中由下面的「正在打开…」负责；真正的错误由上面的 error 监听立刻显示。
   */
  setTimeout(function () {
    if (window.__appReady) return;
    var box = document.getElementById('bootFail');
    if (box) box.hidden = false;
  }, 20000);
</script>

<!-- 图标：内联 SVG，避免依赖外部图标库，也保证离线可用 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="i-today"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v5l3 2"/></g>
    <g id="i-pencil"><path d="M4 20h4l10-10a2.5 2.5 0 0 0-3.5-3.5L4 16.5V20z"/><path d="M13.5 6.5 17.5 10.5"/></g>
    <g id="i-plan"><path d="M5 4.5h14v15H5z"/><path d="M5 9.5h14M9 4.5v15"/></g>
    <g id="i-trend"><path d="M4 17l5-5 3.5 3.5L20 8"/><path d="M15 8h5v5"/></g>
    <g id="i-left"><path d="M14.5 6 9 12l5.5 6"/></g>
    <g id="i-right"><path d="M9.5 6 15 12l-5.5 6"/></g>
    <g id="i-cal"><path d="M4.5 6.5h15v13h-15z"/><path d="M4.5 10.5h15M9 4v4M15 4v4"/></g>
    <g id="i-cog"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.2M12 18.8V21M4.9 7.5l1.9 1.1M17.2 15.4l1.9 1.1M4.9 16.5l1.9-1.1M17.2 8.6l1.9-1.1"/></g>
    <g id="i-plus"><path d="M12 5.5v13M5.5 12h13"/></g>
    <g id="i-close"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></g>
    <g id="i-chat"><path d="M4.5 6.5h15v10h-9l-6 4z"/></g>
    <g id="i-fire"><path d="M12 3.5c3 3.5 5.5 5.6 5.5 9a5.5 5.5 0 0 1-11 0c0-2 .8-3.2 2-4.7.4 1.4 1 2.2 2 2.6-.6-2.6.3-5 1.5-6.9z"/></g>
    <g id="i-pin"><path d="M12 21s6.5-5.7 6.5-10.5A6.5 6.5 0 0 0 5.5 10.5C5.5 15.3 12 21 12 21z"/><circle cx="12" cy="10.5" r="2.4"/></g>
  </defs>
</svg>

<header class="topbar">
  <button id="prevDay" class="icon-btn" aria-label="前一天">
    <svg viewBox="0 0 24 24" class="ic"><use href="#i-left"/></svg>
  </button>
  <button id="dateLabel" class="date-label">
    <svg viewBox="0 0 24 24" class="ic"><use href="#i-cal"/></svg>
    <span id="dateText">今天</span>
  </button>
  <button id="nextDay" class="icon-btn" aria-label="后一天">
    <svg viewBox="0 0 24 24" class="ic"><use href="#i-right"/></svg>
  </button>
  <span id="nameTag" class="name-tag">小繁</span>
  <button id="profileBtn" class="avatar" aria-label="我的资料">我</button>
</header>

<main id="app"></main>

<nav class="tabbar">
  <button data-view="today" class="tab active">
    <svg viewBox="0 0 24 24" class="ic"><use href="#i-today"/></svg>今天</button>
  <button data-view="log" class="tab">
    <svg viewBox="0 0 24 24" class="ic"><use href="#i-pencil"/></svg>记录</button>
  <button data-view="plan" class="tab">
    <svg viewBox="0 0 24 24" class="ic"><use href="#i-plan"/></svg>计划</button>
  <button data-view="progress" class="tab">
    <svg viewBox="0 0 24 24" class="ic"><use href="#i-trend"/></svg>我的</button>
</nav>

<div id="sheetRoot" class="sheet-root hidden" aria-hidden="true">
  <div class="sheet-mask"></div>
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-head">
      <div id="sheetTitle" class="sheet-title">标题</div>
      <button id="sheetClose" class="icon-btn" aria-label="关闭"><svg viewBox="0 0 24 24" class="ic"><use href="#i-close"/></svg></button>
    </div>
    <div id="sheetBody" class="sheet-body"></div>
    <div id="sheetFoot" class="sheet-foot"></div>
  </div>
</div>

<!-- 正在打开：慢网下先给一句人话，别让用户对着白屏（出现即用，不依赖任何外部资源） -->
<div id="bootLoading" style="max-width:440px;margin:28px auto;padding:0 16px">
  <div class="card" style="padding:18px 16px">
    <div class="card-title" style="margin:0 0 6px">正在打开…</div>
    <p class="tiny muted" style="margin:0">第一次打开、或者网络慢的时候会多等一会儿；记录都在本机，不会丢。</p>
  </div>
</div>

<!--
  启动失败兜底：这份 DOM 必须存在。
  上面那段内联脚本和 app.js 里的 renderBootFailure() 都是往 #bootFail 里写内容的；
  之前 index.html 里根本没有这个元素，于是「模块没起来」时所有兜底都静默失效 ——
  页面上什么都不显示，就是用户报过的「白屏」。这个块平时 hidden，脚本判定失败才显示。
-->
<div id="bootFail" class="boot-fail" hidden>
  <div class="card">
    <div class="card-title">没能打开</div>
    <p class="small muted" style="margin:0 0 12px">
      页面没有加载成功。先点下面刷新一次；如果还是这样，把这段小字截图发给我，我能判断是哪一步卡住了。
    </p>
    <button class="btn block" onclick="location.reload()">刷新一次</button>
    <p class="tiny muted" id="bootFailDetail" style="margin:12px 0 0;word-break:break-all"></p>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
