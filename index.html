<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16a34a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>减脂小助手</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <button id="prevDay" class="icon-btn" aria-label="前一天">‹</button>
  <button id="dateLabel" class="date-label">今天</button>
  <button id="nextDay" class="icon-btn" aria-label="后一天">›</button>
  <button id="profileBtn" class="avatar" aria-label="我的资料">我</button>
</header>

<main id="app"></main>

<nav class="tabbar">
  <button data-view="today" class="tab active"><span class="tab-icon">◎</span>今天</button>
  <button data-view="log" class="tab"><span class="tab-icon">✎</span>记录</button>
  <button data-view="plan" class="tab"><span class="tab-icon">☰</span>推荐</button>
  <button data-view="progress" class="tab"><span class="tab-icon">↗</span>体重</button>
</nav>

<div id="sheetRoot" class="sheet-root hidden" aria-hidden="true">
  <div class="sheet-mask"></div>
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-head">
      <div id="sheetTitle" class="sheet-title">标题</div>
      <button id="sheetClose" class="icon-btn" aria-label="关闭">✕</button>
    </div>
    <div id="sheetBody" class="sheet-body"></div>
    <div id="sheetFoot" class="sheet-foot"></div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
